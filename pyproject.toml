[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-ai-harness"
version = "2.0.0"
description = "Bootstrap Django projects with strong DX, HackSoft architecture, and instructions AI agents can follow."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Leonardo Hakim" }]
keywords = [
  "django",
  "cookiecutter",
  "scaffold",
  "developer-experience",
  "ai-agents",
  "agent-skills",
  "hacksoft",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Framework :: Django",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
]
dependencies = ["cookiecutter>=2.6"]

[project.optional-dependencies]
wizard = ["textual>=1.0,<7"]

[project.urls]
Homepage = "https://github.com/leohakim/django-ai-harness"
Documentation = "https://github.com/leohakim/django-ai-harness/tree/main/docs"
Source = "https://github.com/leohakim/django-ai-harness"
Issues = "https://github.com/leohakim/django-ai-harness/issues"
Changelog = "https://github.com/leohakim/django-ai-harness/blob/main/CHANGELOG.md"

[project.scripts]
django-ai-harness = "django_ai_harness.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.9", "textual>=1.0,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/django_ai_harness"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "knowledge/", "skills/", "README.md", "LICENSE"]

# ==== pytest ====
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

# ==== coverage ====
[tool.coverage.run]
source = ["src/django_ai_harness"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

# ==== ruff ====
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["example"]

[tool.ruff.lint]
select = [
  "A",   # flake8-builtins
  "ARG", # flake8-unused-arguments
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "COM", # flake8-commas
  "E",   # pycodestyle errors
  "EM",  # flake8-errmsg
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "PERF",
  "PIE",
  "PL",  # pylint
  "PTH", # flake8-use-pathlib
  "RET", # flake8-return
  "RUF",
  "S",   # flake8-bandit
  "SIM", # flake8-simplify
  "T20", # flake8-print
  "TID", # flake8-tidy-imports
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]
ignore = [
  "COM812", # conflicts with the formatter
  "S603",   # subprocess call: inputs are validated by the caller
]

[tool.ruff.lint.per-file-ignores]
# A bilingual data catalog: breaking translated sentences across lines to satisfy a
# column limit makes them harder to review and to translate.
"src/django_ai_harness/wizard/steps.py" = ["E501"]
# The CLI is a console application: printing is the interface.
"src/django_ai_harness/cli.py" = ["T20"]
"src/django_ai_harness/overlay.py" = ["T20"]
"src/django_ai_harness/scaffold.py" = ["T20"]
# Maintenance utilities report to the terminal.
"scripts/bump_dev_requirements.py" = ["T20"]
"overlay/apply.py" = ["T20"]
# Tests may assert on internals and use short names.
"tests/*" = ["PLR2004", "S101", "S603", "S607"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
