# django-ai-harness — PostgreSQL tuning for ~4GB shared VPS (app + Redis + Postgres)
# Mount into Postgres conf.d or include from postgresql.conf.
# Assumes PgBouncer handles client concurrency — keep max_connections modest.

shared_buffers = 512MB
effective_cache_size = 2GB
work_mem = 8MB
maintenance_work_mem = 128MB
wal_buffers = 16MB
max_connections = 60
checkpoint_completion_target = 0.9
random_page_cost = 1.1
effective_io_concurrency = 200
min_wal_size = 512MB
max_wal_size = 2GB
