# Opt-in PgBouncer in front of cookiecutter-django's postgres service.
# Usage (local):
#   docker compose -f docker-compose.local.yml -f docker-compose.pgbouncer.yml up -d
# Usage (production):
#   docker compose -f docker-compose.production.yml -f docker-compose.pgbouncer.yml up -d
#   # and set env_file below to ./.envs/.production/.postgres
#
# App env (see knowledge/dx-practices/postgres-pooling.md):
#   USE_PGBOUNCER=True
#   POSTGRES_HOST=pgbouncer
#   POSTGRES_PORT=6432
#   CONN_MAX_AGE=0
#
# Migrate against Postgres directly (bypass pooler):
#   POSTGRES_HOST=postgres POSTGRES_PORT=5432 USE_PGBOUNCER=False ...

services:
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p1
    depends_on:
      - postgres
    # Default fragment targets local Compose. For production, override env_file:
    #   env_file: ./.envs/.production/.postgres
    env_file:
      - ./.envs/.local/.postgres
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
      MIN_POOL_SIZE: "2"
      RESERVE_POOL_SIZE: "5"
      AUTH_TYPE: scram-sha-256
    volumes:
      - ./compose/pgbouncer/entrypoint.sh:/entrypoint-harness.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint-harness.sh"]
    # Bind localhost only — avoid exposing the pooler on all interfaces
    ports:
      - "127.0.0.1:6432:6432"
    restart: unless-stopped

  django:
    depends_on:
      - pgbouncer
