services:
  docs:
    image: harness_example_local_docs
    container_name: harness_example_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    env_file:
      - ./.envs/.local/.django
    volumes:
      - /app/.venv
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./harness_example:/app/harness_example:z
    ports:
      - '9000:9000'
    command: /start-docs
