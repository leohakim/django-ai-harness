# django-ai-harness — PostgreSQL tuning for ~2GB shared VPS (app + Redis + Postgres)
# Mount into Postgres conf.d or include from postgresql.conf.
# Assumes PgBouncer handles client concurrency — keep max_connections low.

shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 4MB
maintenance_work_mem = 64MB
wal_buffers = 16MB
max_connections = 40
checkpoint_completion_target = 0.9
random_page_cost = 1.1
effective_io_concurrency = 200
min_wal_size = 256MB
max_wal_size = 1GB
