# Opt-in PgBouncer in front of cookiecutter-django's postgres service.
#
# The engine stays PostgreSQL; this only adds a transaction-mode connection pooler so a
# host with many workers stops paying for one Postgres backend process per connection.
#
# Local:
#   docker compose -f docker-compose.local.yml -f docker-compose.pgbouncer.yml up -d
#
# Production:
#   docker compose -f docker-compose.production.yml \
#     -f docker-compose.pgbouncer.yml \
#     -f docker-compose.pgbouncer.production.yml up -d
#
# Application environment (the overlay writes these with --with-pgbouncer):
#   USE_PGBOUNCER=True
#   POSTGRES_HOST=pgbouncer
#   POSTGRES_PORT=6432
#   CONN_MAX_AGE=0
#
# DDL must bypass the pooler. The overlay defines a `direct` database alias for that:
#   python manage.py migrate --database=direct
#
# Configuration is env-driven: the edoburu image renders pgbouncer.ini and the auth file
# from the DB_*/POOL_* variables below, so there is no ini to keep in sync. To run a
# hand-written config instead, mount it over /etc/pgbouncer/pgbouncer.ini and drop the
# custom entrypoint.

services:
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p1
    depends_on:
      - postgres
    env_file:
      - ./.envs/.local/.postgres
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
      MIN_POOL_SIZE: "2"
      RESERVE_POOL_SIZE: "5"
      AUTH_TYPE: scram-sha-256
    volumes:
      - ./compose/pgbouncer/entrypoint.sh:/entrypoint-harness.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint-harness.sh"]
    # Bound to loopback: the pooler must never be reachable from other interfaces.
    ports:
      - "127.0.0.1:6432:6432"
    # edoburu/pgbouncer is not a Postgres client image; pg_isready is not on PATH.
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  django:
    depends_on:
      - pgbouncer
