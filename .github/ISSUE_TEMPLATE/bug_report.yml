name: Bug report
description: Something in the harness, the overlay, or a generated project misbehaves.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. uvx django-ai-harness new ~/tmp/demo "Demo"
        2. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste the output of `django-ai-harness info`, plus your OS and Python version.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output
      description: The full error, if there is one.
      render: shell
