# NOTE: the Discussions link below 404s until Discussions is enabled in
# Settings -> General -> Features. Blank issues are off, so that link is the only
# route for questions. See docs/maintaining.md -> Pending setup.
blank_issues_enabled: false
contact_links:
  - name: Question or idea
    url: https://github.com/leohakim/django-ai-harness/discussions
    about: Ask about usage, or float an idea before opening a pull request.
  - name: Security vulnerability
    url: https://github.com/leohakim/django-ai-harness/security/advisories/new
    about: Report privately. Please do not open a public issue.
